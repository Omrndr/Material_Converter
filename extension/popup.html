<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>MatWeb → ANSYS</header>

  <section>
    <div id="page-name" class="muted">Sayfa kontrol ediliyor…</div>
    <ul id="page-warnings" class="warnings"></ul>
    <div class="row">
      <button id="add" class="primary" disabled>Kütüphaneye ekle</button>
      <button id="export-one" disabled title="Bu sayfanın tüm verisini ayrıntılı (genel) XML olarak indir">Genel XML</button>
    </div>
  </section>

  <section>
    <div class="section-title">Son eklenenler <span id="count" class="muted"></span></div>
    <ul id="list"></ul>
    <div id="empty" class="muted">Henüz malzeme yok.</div>
    <div class="row">
      <button id="open-library" class="primary">Kütüphaneyi aç</button>
      <button id="download" disabled title="Tüm kütüphaneyi ayarlardaki konuma yaz">Kütüphaneyi yaz</button>
    </div>
    <div id="path" class="muted small"></div>
  </section>

  <div id="status" role="status"></div>

  <script src="lib/xml-writer.js"></script>
  <script src="lib/ansys-writer.js"></script>
  <script src="lib/store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
