<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand">
    <img src="icons/icon.svg" alt="" width="28" height="28">
    <div>
      <div class="brand-title">Material Converter</div>
      <div class="brand-sub" data-i18n="brand_sub">MatWeb → ANSYS Engineering Data</div>
    </div>
  </header>

  <main>
    <!-- 1) Açık sekmedeki sayfa -->
    <section class="card page">
      <div class="eyebrow" data-i18n="popup_open_page">Current page</div>

      <div id="state-loading" class="muted" data-i18n="popup_loading">Reading page…</div>

      <div id="state-empty" hidden>
        <p class="lead" data-i18n="popup_empty_lead"></p>
        <ol class="steps">
          <li data-i18n-html="popup_empty_step1_html"></li>
          <li data-i18n="popup_empty_step2"></li>
          <li data-i18n-html="popup_empty_step3_html"></li>
        </ol>
      </div>

      <div id="state-nodata" hidden>
        <p id="nodata-lead" class="lead" data-i18n="popup_nodata_lead"></p>
        <p id="nodata-hint" class="muted" data-i18n="popup_nodata_hint"></p>
      </div>

      <div id="state-material" hidden>
        <h1 id="mat-name"></h1>
        <div id="mat-category" class="muted"></div>
        <div class="chips">
          <span id="mat-status" class="chip"></span>
          <span id="mat-props" class="chip info"></span>
        </div>
        <div id="mat-groups" class="group-chips"></div>
        <div id="page-warnings"></div>
        <button id="add" class="btn primary block" data-icon="plus" data-i18n="btn_add">Add to library</button>
        <button id="export-one" class="btn ghost block" data-icon="download"
                data-i18n="btn_export_one" data-i18n-title="btn_export_one_title">Download all data as a separate XML</button>
      </div>
    </section>

    <!-- 2) Kütüphane özeti -->
    <section class="card library">
      <div class="library-head">
        <div>
          <div class="eyebrow" data-i18n="popup_library">Library</div>
          <div class="count" data-i18n-html="popup_count_html"><span id="count">0</span> materials</div>
        </div>
        <button id="open-library" class="btn" data-icon="library" data-i18n="btn_manage_library">Manage library</button>
      </div>
      <div class="file">
        <span data-icon="file"></span>
        <div>
          <div id="path-file" class="path-file"></div>
          <div id="path-dir" class="path-dir"></div>
          <div id="file-meta" class="muted"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="lib/ui.js"></script>
  <script src="lib/xml-writer.js"></script>
  <script src="lib/ansys-writer.js"></script>
  <script src="lib/store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
